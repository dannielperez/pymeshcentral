[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymeshcentral"
version = "0.1.0"
description = "Python client for the MeshCentral control API (login-token auth, read-only device/group listing)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Daniel Perez" }]
keywords = ["meshcentral", "remote-access", "device-management"]
dependencies = ["websockets>=15,<16"]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/pymeshcentral"]
